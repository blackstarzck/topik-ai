name: Company production release

on:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read
  actions: read

concurrency:
  group: topik-admin-production
  queue: max

env:
  NODE_VERSION: '24.x'
  VERCEL_CLI_VERSION: '48.12.0'
  TIP_SHA: ${{ github.sha }}
  # validate-release-env.mjs locks this against its own pinned constant, so the
  # value must stay a literal here and match every other workflow's pin.
  V13_CONTRACT_SHA: 0ee149930019c8a6f97644824c390d7d2ec76067

jobs:
  verify:
    name: verify-company-release
    if: ${{ github.repository == 'keduall/topik-admin' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      release_plan: ${{ steps.verify.outputs.release_plan }}
      deploy_app: ${{ steps.verify.outputs.deploy_app }}
      apply_migrations: ${{ steps.verify.outputs.apply_migrations }}
      source_sha: ${{ steps.verify.outputs.source_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TIP_SHA }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Re-verify the full promotion contract before any mutation
        id: verify
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EVIDENCE_GITHUB_TOKEN: ${{ secrets.EVIDENCE_GITHUB_TOKEN }}
        run: |
          test "$(git rev-parse HEAD)" = "$TIP_SHA"
          node scripts/ci/verify-company-release.mjs \
            --tip-sha "$TIP_SHA" \
            --evidence-dir development-evidence \
            --json-out release-evidence/company-release-verify.json \
            --github-output "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: company-release-verify-${{ env.TIP_SHA }}
          path: |
            release-evidence/*.json
            development-evidence/*.json
          if-no-files-found: error
          retention-days: 90

  release-database-only:
    name: topik-prod-database-only-release
    needs: verify
    if: ${{ github.repository == 'keduall/topik-admin' && needs.verify.outputs.release_plan == 'db-only' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: Production
    env:
      SOURCE_SHA: ${{ needs.verify.outputs.source_sha }}
      PROD_ADMIN_DOMAIN: ${{ vars.PROD_ADMIN_DOMAIN }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
      SUPABASE_EXPECTED_PROJECT_REF: ${{ vars.SUPABASE_EXPECTED_PROJECT_REF }}
      SUPABASE_PRODUCTION_CONFIRM: ${{ vars.SUPABASE_PROJECT_REF }}
      SUPABASE_MIGRATION_OPERATOR: github-actions-company-production
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
      E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
      E2E_TARGET_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TIP_SHA }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Install Chromium for Production browser verification
        run: npx playwright install --with-deps chromium
      - uses: actions/download-artifact@v4
        with:
          name: company-release-verify-${{ env.TIP_SHA }}
          path: verify-artifact
      - name: Lock the database-only release target
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$TIP_SHA"
          node scripts/ci/validate-release-env.mjs --mode database
          mkdir -p release-evidence
          cp verify-artifact/release-evidence/company-release-verify.json release-evidence/
          cp verify-artifact/development-evidence/development.json release-evidence/development.json
          npm run db:contracts:verify -- --json-out release-evidence/migration-contracts.json
      - name: Compare topik-prod trackers read-only before any mutation
        shell: bash
        run: |
          npm run db:migrate -- --verify-all --manifest scripts/db/manifests/writing-production-cutover.json --batch release-all --json-out release-evidence/writing-preflight.json
          npm run db:admin:migrate -- --verify-all --manifest scripts/db/manifests/admin-production-cutover.json --batch release-all --json-out release-evidence/admin-preflight.json
          node -e "for (const f of ['writing','admin']) { const r = require('./release-evidence/' + f + '-preflight.json'); const blockers = [...r.issues.checksumMismatch, ...r.issues.remoteOnly, ...r.issues.blockedApplied]; if (blockers.length) { console.error(f + ' preflight blockers: ' + blockers.join(',')); process.exit(1); } }"
      - name: Verify the current Production app before the database change
        run: >-
          node scripts/ci/run-release-e2e.mjs
          --target production
          --suite operational-smoke
          --json-out release-evidence/production-before-migration-e2e.json
        env:
          ADMIN_E2E_BASE_URL: https://${{ vars.PROD_ADMIN_DOMAIN }}
      - name: Apply topik-prod expand migrations in ownership order
        shell: bash
        run: |
          npm run db:migrate -- --apply --manifest scripts/db/manifests/writing-production-cutover.json --batch release-all
          npm run db:admin:migrate -- --apply --manifest scripts/db/manifests/admin-production-cutover.json --batch release-all
      - name: Verify Production trackers, RPC definitions, and permissions
        shell: bash
        run: |
          npm run db:migrate -- --verify-all --require-clean --manifest scripts/db/manifests/writing-production-cutover.json --batch release-all --json-out release-evidence/writing-migrations.json
          npm run db:admin:migrate -- --verify-all --require-clean --manifest scripts/db/manifests/admin-production-cutover.json --batch release-all --json-out release-evidence/admin-migrations.json
          npm run db:users-contract -- --expected-project-ref "$SUPABASE_EXPECTED_PROJECT_REF" --require-no-legacy-phone --json-out release-evidence/users-contract.json
      - name: Verify the unchanged Production app after the database change
        run: >-
          node scripts/ci/run-release-e2e.mjs
          --target production
          --suite operational-smoke
          --json-out release-evidence/production-after-migration-e2e.json
        env:
          ADMIN_E2E_BASE_URL: https://${{ vars.PROD_ADMIN_DOMAIN }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: company-production-release-${{ env.TIP_SHA }}
          path: release-evidence/*.json
          if-no-files-found: error
          retention-days: 90

  release-app:
    name: staged-production-app-release
    needs: verify
    if: ${{ github.repository == 'keduall/topik-admin' && (needs.verify.outputs.release_plan == 'app-only' || needs.verify.outputs.release_plan == 'app-db') }}
    runs-on: ubuntu-latest
    timeout-minutes: 75
    environment: Production
    env:
      SOURCE_SHA: ${{ needs.verify.outputs.source_sha }}
      APPLY_MIGRATIONS: ${{ needs.verify.outputs.apply_migrations }}
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      PROD_ADMIN_DOMAIN: ${{ vars.PROD_ADMIN_DOMAIN }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
      SUPABASE_EXPECTED_PROJECT_REF: ${{ vars.SUPABASE_EXPECTED_PROJECT_REF }}
      SUPABASE_PRODUCTION_CONFIRM: ${{ vars.SUPABASE_PROJECT_REF }}
      SUPABASE_MIGRATION_OPERATOR: github-actions-company-production
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
      E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
      E2E_TARGET_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TIP_SHA }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Install Chromium for Production browser verification
        run: npx playwright install --with-deps chromium
      - uses: actions/download-artifact@v4
        with:
          name: company-release-verify-${{ env.TIP_SHA }}
          path: verify-artifact
      - name: Lock the app release targets
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$TIP_SHA"
          node scripts/ci/validate-release-env.mjs --mode app
          mkdir -p release-evidence
          cp verify-artifact/release-evidence/company-release-verify.json release-evidence/
          cp verify-artifact/development-evidence/development.json release-evidence/development.json
          npm run db:contracts:verify -- --json-out release-evidence/migration-contracts.json
      - name: Capture current Production deployment
        id: previous
        run: >-
          node scripts/ci/capture-vercel-production.mjs
          --domain "$PROD_ADMIN_DOMAIN"
          --team-id "$VERCEL_ORG_ID"
          --json-out release-evidence/previous-deployment.json
      - name: Install the pinned Vercel CLI
        run: npm install --global vercel@$VERCEL_CLI_VERSION
      - name: Configure ephemeral Vercel CLI authentication
        shell: bash
        run: |
          export VERCEL_GLOBAL_CONFIG="$RUNNER_TEMP/vercel-cli"
          install -m 700 -d "$VERCEL_GLOBAL_CONFIG"
          node -e "const fs=require('node:fs'); fs.writeFileSync(process.env.VERCEL_GLOBAL_CONFIG + '/auth.json', JSON.stringify({token:process.env.VERCEL_TOKEN}), {mode:0o600})"
          echo "VERCEL_GLOBAL_CONFIG=$VERCEL_GLOBAL_CONFIG" >> "$GITHUB_ENV"
          vercel whoami --global-config "$VERCEL_GLOBAL_CONFIG"
      - name: Require the candidate browser bypass secret
        shell: bash
        env:
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          if [ -z "$VERCEL_AUTOMATION_BYPASS_SECRET" ]; then
            echo "::error::Missing Production environment secret VERCEL_AUTOMATION_BYPASS_SECRET."
            exit 1
          fi
      - name: Build an unaliased Production candidate
        id: candidate
        shell: bash
        env:
          VITE_RELEASE_SHA: ${{ needs.verify.outputs.source_sha }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          rm -rf .vercel
          vercel pull --yes --environment=production --global-config "$VERCEL_GLOBAL_CONFIG"
          node -e "const p=require('./.vercel/project.json'); if(p.orgId!==process.env.VERCEL_ORG_ID||p.projectId!==process.env.VERCEL_PROJECT_ID) process.exit(1)"
          # The project stores VITE_SUPABASE_* as Vercel sensitive variables, so
          # `vercel pull` cannot return them and an unguarded CI build ships a
          # bundle with no Supabase endpoint at all. Pin them the same way the
          # stg preview build does, deriving the URL from the already-locked
          # project ref so a topik-dev value cannot leak into a Production build.
          test -n "$SUPABASE_PROJECT_REF"
          if [ -z "$VITE_SUPABASE_PUBLISHABLE_KEY" ]; then
            echo "::error::Missing Production environment secret VITE_SUPABASE_PUBLISHABLE_KEY."
            exit 1
          fi
          touch .vercel/.env.production.local
          grep -vE '^(VITE_SUPABASE_URL|VITE_SUPABASE_PUBLISHABLE_KEY|VITE_SUPABASE_ANON_KEY|VITE_SUPABASE_DISABLED)=' .vercel/.env.production.local > .vercel/.env.production.local.next || true
          {
            printf 'VITE_SUPABASE_URL="https://%s.supabase.co"\n' "$SUPABASE_PROJECT_REF"
            printf 'VITE_SUPABASE_PUBLISHABLE_KEY="%s"\n' "$VITE_SUPABASE_PUBLISHABLE_KEY"
            printf 'VITE_SUPABASE_ANON_KEY="%s"\n' "$VITE_SUPABASE_PUBLISHABLE_KEY"
            printf 'VITE_SUPABASE_DISABLED=""\n'
          } >> .vercel/.env.production.local.next
          mv .vercel/.env.production.local.next .vercel/.env.production.local
          vercel build --prod --global-config "$VERCEL_GLOBAL_CONFIG"
          node scripts/ci/assert-bundle-supabase-target.mjs --project-ref "$SUPABASE_PROJECT_REF"
          candidate_url="$(vercel deploy --prebuilt --prod --skip-domain --yes --global-config "$VERCEL_GLOBAL_CONFIG" | tail -n 1)"
          vercel inspect "$candidate_url" --wait --timeout 10m --global-config "$VERCEL_GLOBAL_CONFIG"
          node scripts/ci/capture-vercel-production.mjs \
            --domain "$candidate_url" \
            --team-id "$VERCEL_ORG_ID" \
            --json-out release-evidence/candidate-deployment.json
      - name: Verify the current Production app before any database change
        run: >-
          node scripts/ci/run-release-e2e.mjs
          --target production
          --suite operational-smoke
          --json-out release-evidence/production-before-release-e2e.json
        env:
          ADMIN_E2E_BASE_URL: https://${{ vars.PROD_ADMIN_DOMAIN }}
      - name: Compare topik-prod trackers read-only before any mutation
        if: ${{ needs.verify.outputs.apply_migrations == 'true' }}
        shell: bash
        run: |
          npm run db:migrate -- --verify-all --manifest scripts/db/manifests/writing-production-cutover.json --batch release-all --json-out release-evidence/writing-preflight.json
          npm run db:admin:migrate -- --verify-all --manifest scripts/db/manifests/admin-production-cutover.json --batch release-all --json-out release-evidence/admin-preflight.json
          node -e "for (const f of ['writing','admin']) { const r = require('./release-evidence/' + f + '-preflight.json'); const blockers = [...r.issues.checksumMismatch, ...r.issues.remoteOnly, ...r.issues.blockedApplied]; if (blockers.length) { console.error(f + ' preflight blockers: ' + blockers.join(',')); process.exit(1); } }"
      - name: Apply topik-prod expand migrations for an app-db release
        if: ${{ needs.verify.outputs.apply_migrations == 'true' }}
        shell: bash
        run: |
          npm run db:migrate -- --apply --manifest scripts/db/manifests/writing-production-cutover.json --batch release-all
          npm run db:admin:migrate -- --apply --manifest scripts/db/manifests/admin-production-cutover.json --batch release-all
      - name: Verify Production tracker and permission drift
        shell: bash
        run: |
          npm run db:migrate -- --verify-all --require-clean --manifest scripts/db/manifests/writing-production-cutover.json --batch release-all --json-out release-evidence/writing-migrations.json
          npm run db:admin:migrate -- --verify-all --require-clean --manifest scripts/db/manifests/admin-production-cutover.json --batch release-all --json-out release-evidence/admin-migrations.json
          npm run db:users-contract -- --expected-project-ref "$SUPABASE_EXPECTED_PROJECT_REF" --require-no-legacy-phone --json-out release-evidence/users-contract.json
      - name: Verify the old Production app after an app-db migration
        if: ${{ needs.verify.outputs.apply_migrations == 'true' }}
        run: >-
          node scripts/ci/run-release-e2e.mjs
          --target production
          --suite operational-smoke
          --json-out release-evidence/old-app-after-migration-e2e.json
        env:
          ADMIN_E2E_BASE_URL: https://${{ vars.PROD_ADMIN_DOMAIN }}
      - name: Verify the candidate with the configured administrator account
        run: >-
          node scripts/ci/run-release-e2e.mjs
          --target candidate
          --suite operational-smoke
          --json-out release-evidence/candidate-e2e.json
        env:
          ADMIN_E2E_BASE_URL: ${{ steps.candidate.outputs.deployment_url }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
      # promote/rollback/logs resolve a deployment id or domain directly instead
      # of going through the pulled project link, so without an explicit scope
      # they fall back to the token's default account and fail with
      # "Deployment belongs to a different team".
      - name: Promote the verified candidate without rebuilding
        id: promote
        run: >-
          vercel promote "${{ steps.candidate.outputs.deployment_id }}"
          --scope "$VERCEL_ORG_ID"
          --yes --timeout 10m --global-config "$VERCEL_GLOBAL_CONFIG"
      - name: Verify the Production domain and runtime error stream
        id: production_smoke
        shell: bash
        run: |
          vercel logs "$PROD_ADMIN_DOMAIN" --json --scope "$VERCEL_ORG_ID" --global-config "$VERCEL_GLOBAL_CONFIG" > .vercel-runtime.ndjson 2> .vercel-runtime.stderr &
          log_pid=$!
          sleep 2
          set +e
          ADMIN_E2E_BASE_URL="https://$PROD_ADMIN_DOMAIN" node scripts/ci/run-release-e2e.mjs --target production --suite operational-smoke --json-out release-evidence/production-e2e.json
          smoke_status=$?
          kill "$log_pid" 2>/dev/null
          wait "$log_pid" 2>/dev/null
          set -e
          node scripts/ci/check-vercel-runtime-logs.mjs --input .vercel-runtime.ndjson --json-out release-evidence/runtime-log-summary.json
          test "$smoke_status" -eq 0
      - name: Roll back the Production alias when post-promotion checks fail
        if: always() && steps.promote.outcome == 'success' && steps.production_smoke.outcome == 'failure'
        shell: bash
        run: |
          vercel rollback "${{ steps.previous.outputs.deployment_id }}" --scope "$VERCEL_ORG_ID" --yes --timeout 10m --global-config "$VERCEL_GLOBAL_CONFIG"
          node scripts/ci/capture-vercel-production.mjs \
            --domain "$PROD_ADMIN_DOMAIN" \
            --team-id "$VERCEL_ORG_ID" \
            --json-out release-evidence/rollback-deployment.json
          node -e "const fs=require('node:fs'); const previous=JSON.parse(fs.readFileSync('release-evidence/previous-deployment.json')); const restored=JSON.parse(fs.readFileSync('release-evidence/rollback-deployment.json')); if(previous.deploymentId!==restored.deploymentId) { console.error('Rollback verification did not restore the previous deployment.'); process.exit(1); }"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: company-production-release-${{ env.TIP_SHA }}
          path: release-evidence/*.json
          if-no-files-found: error
          retention-days: 90